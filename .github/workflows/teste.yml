name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes (headless)
        run: pytest -v --headless --html=reports/relatorio.html --self-contained-html

      - name: Guardar relatório e screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorios
          path: reports/